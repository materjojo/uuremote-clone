plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.uuremote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.uuremote'
        minSdk 26
        targetSdk 34
        versionCode 633
        versionName '4.48.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

}

configurations {
    protocArtifact
}

dependencies {
    protocArtifact 'com.google.protobuf:protoc:3.25.3:linux-x86_64@exe'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.3'
    implementation 'io.github.webrtc-sdk:android:125.6422.07'
}


// 用官方 proto 直接生成 lite Java 绑定（绕开插件在 AGP8 下的源集问题）
tasks.register('genProtos', Exec) {
    def exe = configurations.protocArtifact.singleFile
    inputs.dir '../../../proto/gv_pb'
    outputs.dir 'src/main/java/gv_pb'
    doFirst {
        exe.setExecutable(true)
        delete fileTree('src/main/java/gv_pb')
    }
    commandLine exe.absolutePath,
        '--java_out=lite:src/main/java',
        '-I', '../../../proto/gv_pb'
    // protoc 要求显式列出 .proto 文件
    def protos = fileTree('../../../proto/gv_pb').matching { include '*.proto' }.files
    args(protos.collect { it.absolutePath })
}
preBuild.dependsOn 'genProtos'
