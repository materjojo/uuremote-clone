name: build

on:
  push:
  workflow_dispatch:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build core/build --config Release
      - name: Test
        run: ctest --test-dir core/build --output-on-failure -C Release

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Resolve
        run: swift package resolve
      - name: Build
        run: swift build -c release
      - name: Package .app
        run: bash scripts/make_app.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UURemoteClone-app
          path: build/UURemoteClone.app
          if-no-files-found: error

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WPF app
        run: dotnet build platforms/windows/UURemoteClone.Windows.csproj -c Release

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK check
        run: |
          echo "SDK=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p platforms/android assembleDebug --no-daemon