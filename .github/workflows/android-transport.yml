name: Android native peer transport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable KVM for Android emulator
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle -p platforms/android -PuuTestAbi=x86_64 connectedDebugAndroidTest --no-daemon
            mkdir -p build/android-evidence
            adb pull /sdcard/Download/uuremote-home-empty.png build/android-evidence/home-empty.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-peer-results
          path: |
            build/android-evidence/
            platforms/android/app/build/outputs/androidTest-results/
            platforms/android/app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: warn
